services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatx
      POSTGRES_USER: chatx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - chatx-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatx -d chatx"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://chatx:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/chatx
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CHATX_TRUST_PROXY: ${CHATX_TRUST_PROXY:-true}
      CHATX_CORS_ORIGIN: ${CHATX_CORS_ORIGIN:-}
      CHATX_BIND: 0.0.0.0
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  chatx-pg:
