services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatx
      POSTGRES_USER: chatx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - chatx-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatx -d chatx"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build: ./server
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    # Required only by the root entrypoint before it switches to user node.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    environment:
      DATABASE_URL: postgres://chatx:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/chatx
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      CHATX_TRUST_PROXY: ${CHATX_TRUST_PROXY:-true}
      CHATX_CORS_ORIGIN: ${CHATX_CORS_ORIGIN:-}
      CHATX_MEDIA_DIR: /media
      CHATX_BIND: 0.0.0.0
    volumes:
      - chatx-media:/media
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - dokploy-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  chatx-pg:
  chatx-media:

networks:
  dokploy-network:
    external: true
